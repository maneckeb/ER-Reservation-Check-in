<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservation Check-in</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #0056d6;
    }
    #message {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      display: none;
      line-height: 1.4;
    }
    #message.success {
      background: #e6ffed;
      color: #1c662d;
      border: 1px solid #a8e5b5;
    }
    #message.error {
      background: #ffe8e8;
      color: #8a2222;
      border: 1px solid #f1b0b0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reservation Check-in</h1>
    <form id="checkin-form">
      <label for="reservationId">Reservation ID</label>
      <input id="reservationId" name="reservationId" type="text" required placeholder="Enter your reservation ID" />
      <button type="submit">Check In</button>
    </form>
    <div id="message" role="status"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    
    window.onload = function(){
      if (params.has('reservationId')) {
        const reservationId = params.get('reservationId');
        document.getElementById('reservationId').value = reservationId;
        
      }
    }

    const apiUrl = 'https://script.google.com/macros/s/AKfycbyQ3tSNXh69-T410KQAv7Z986v13q3rG5ji9jC9UHyOoXXw4Kyf_alx6c_THs6bH0qKtw/exec?';
    const form = document.getElementById('checkin-form');
    const reservationIdInput = document.getElementById('reservationId');
    const messageEl = document.getElementById('message');

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = '';
      messageEl.classList.add(type);
      messageEl.style.display = 'block';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const reservationId = reservationIdInput.value.trim();

      if (!reservationId) {
        showMessage('Please enter your Reservation ID.', 'error');
        return;
      }
      apiUrlWithParams = `${apiUrl}reservationId=${encodeURIComponent(reservationId)}&branchId=1`;
      console.log(apiUrlWithParams);
      try {
        const response = await fetch(apiUrlWithParams, {
          method: 'GET',
          
          
        });

        const responseBody = await response.json().catch(() => ({}));

        if (responseBody.status === 200) {
          showMessage('Congratulations, you are succesfully checkied in to your Appointment', 'success');
        } else if (responseBody.status === 404) {
          showMessage('This Reservation ID was not found', 'error');
        } else {
          const detail = responseBody.data || 'An unexpected error occurred.';
          showMessage(`${detail} Please ask an associate for assistance`, 'error');
        }
      } catch (error) {
        showMessage('Unable to reach the server. Please ask an associate for assistance', 'error');
      }
    });
  </script>
</body>
</html>
